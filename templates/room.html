<!DOCTYPE html>

<html>

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Room {{ room_id }}</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/style.css') }}">
```

</head>

<body>

```
<h1>

    🏠 Room:
    {{ room_id }}

</h1>

<h2>

    👤 Player:
    {{ username }}

</h2>

<h3>

    👥 Players In Room

</h3>

<ul id="players"></ul>

<hr>

<input
    type="number"
    id="guess"
    placeholder="🎯 Enter Number">

<br><br>

<button
    onclick="playClick(); sendGuess();">

    🎯 Guess

</button>

<br><br>

<a href="/">

    <button
        onclick="playClick()">

        🏠 Home

    </button>

</a>

<h2 id="result"></h2>

<h1 id="winner"></h1>

<!-- Sound Controls -->

<div class="sound-controls">

    <button
        id="musicBtn"
        onclick="toggleMusic()">

        🎵 Music ON

    </button>

    <button
        id="soundBtn"
        onclick="toggleSound()">

        🔊 Sound ON

    </button>

</div>

<!-- Background Music -->

<audio
    id="bgMusic"
    loop>

    <source
        src="{{ url_for('static',
        filename='music/bg_music.mp3') }}"
        type="audio/mpeg">

</audio>

<!-- Click Sound -->

<audio
    id="clickSound">

    <source
        src="{{ url_for('static',
        filename='sounds/click.mp3') }}"
        type="audio/mpeg">

</audio>

<!-- Sound JS -->

<script
    src="{{ url_for('static',
    filename='js/sound.js') }}">
</script>

<script>

    const socket = io();

    socket.on(
        "connect",
        () => {

            console.log(
                "Connected"
            );

        }
    );

    socket.on(
        "connect_error",
        (err) => {

            console.log(
                "ERROR:",
                err
            );

        }
    );

    socket.on(
        "update_players",
        (players) => {

            const list =
            document.getElementById(
                "players"
            );

            list.innerHTML = "";

            players.forEach(
                player => {

                    const li =
                    document.createElement(
                        "li"
                    );

                    li.innerText =
                    player;

                    list.appendChild(
                        li
                    );

                }
            );

        }
    );

    socket.on(
        "guess_result",
        (data) => {

            document
            .getElementById(
                "result"
            )
            .innerText =
            data.message;

        }
    );

    socket.on(
        "winner",
        (data) => {

            document
            .getElementById(
                "winner"
            )
            .innerText =
            `🏆 Winner: ${data.winner} | Attempts: ${data.attempts}`;

        }
    );

    function sendGuess(){

        const guess =
        document
        .getElementById(
            "guess"
        )
        .value;

        socket.emit(
            "guess",
            {

                username:
                "{{ username }}",

                room:
                "{{ room_id }}",

                guess:
                guess

            }
        );

    }

</script>
```

</body>

</html>
