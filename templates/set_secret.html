<!DOCTYPE html>

<html>

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Set Secret Number</title>

<link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/style.css') }}">
```

</head>

<body>

```
<h1>

    🔒 Set Your Secret Number

</h1>

<p>

    🏠 Room:
    {{ room_code }}

</p>

<p>

    👤 Player:
    {{ player_name }}

</p>

<form method="POST">

    <input
        type="number"
        name="secret"
        min="1"
        max="100"
        placeholder="🔒 Enter Secret Number"
        required>

    <br><br>

    <button
        type="submit"
        onclick="playClick()">

        💾 Save Secret Number

    </button>

</form>

<br>

<a href="/">

    <button
        onclick="playClick()">

        🏠 Home

    </button>

</a>

<!-- Sound Controls -->

<div class="sound-controls">

    <button
        id="musicBtn"
        onclick="toggleMusic()">

        🎵 Music ON

    </button>

    <button
        id="soundBtn"
        onclick="toggleSound()">

        🔊 Sound ON

    </button>

</div>

<!-- Background Music -->

<audio
    id="bgMusic"
    loop>

    <source
        src="{{ url_for('static',
        filename='music/bg_music.mp3') }}"
        type="audio/mpeg">

</audio>

<!-- Click Sound -->

<audio
    id="clickSound">

    <source
        src="{{ url_for('static',
        filename='sounds/click.mp3') }}"
        type="audio/mpeg">

</audio>

<!-- Sound JS -->

<script
    src="{{ url_for('static',
    filename='js/sound.js') }}">
</script>
```

</body>

</html>
