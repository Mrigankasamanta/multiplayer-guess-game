<!DOCTYPE html>
<html>

<head>
    <title>Set Secret Number</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>🔒 Set Your Secret Number</h1>

    <p>Room: {{ room_code }}</p>
    <p>Player: {{ player_name }}</p>

    <form method="POST">

        <input type="number" name="secret" min="1" max="100" placeholder="🔒 Enter Secret Number" required>
        <button type="submit">
            Save Secret Number
        </button>

    </form>

</body>

</html>
