<!DOCTYPE html>
<html>

<head>
    <title>Multiplayer Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1 class="game-title">
        🎮 Multiplayer Guess Game
    </h1>

    <h2>Room: {{ room_code }}</h2>

    <h3>Player: {{ player_name }}</h3>

    <a href="/set-secret/{{ room_code }}/{{ player_name }}">
        <button>
            🔒 Set Secret Number
        </button>
    </a>

    <br><br>

    <a href="/start-game/{{ room_code }}/{{ player_name }}">
        <button>
            ▶ Start Game
        </button>
    </a>

    <hr>

    <h3>Players In Room</h3>

    {% for player, data in players.items() %}

    <p>
        👤 {{ player }}
    </p>

    {% endfor %}

    <hr>

    <h2>{{ message }}</h2>

    <br>

    <a href="/">
        Home
    </a>

</body>

</html>
