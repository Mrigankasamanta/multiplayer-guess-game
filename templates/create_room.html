<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Room</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <h1>🏠 Create Room</h1>

    <form action="/create-room-submit" method="POST">

        <input type="text" name="name" placeholder="👤 Enter Your Name" required>

        <br><br>

        <button type="submit" onclick="playClick()">

            🚀 Create Room

        </button>

    </form>

    <br>

    <a href="/">

        <button type="button" onclick="playClick()">

            🏠 Home

        </button>

    </a>

    <!-- Sound Controls -->

    <div class="sound-controls">

        <button id="musicBtn" onclick="toggleMusic()">

            🎵 Music ON

        </button>

        <button id="soundBtn" onclick="toggleSound()">

            🔊 Sound ON

        </button>

    </div>

    <!-- Background Music -->

    <audio id="bgMusic" loop>

        <source src="{{ url_for('static',
            filename='music/bg_music.mp3') }}" type="audio/mpeg">

    </audio>

    <!-- Click Sound -->

    <audio id="clickSound">

        <source src="{{ url_for('static',
            filename='sounds/click.mp3') }}" type="audio/mpeg">

    </audio>

    <!-- Sound JS -->

    <audio id="bgMusic" loop>
        <source src="{{ url_for('static', filename='music/bg_music.mp3') }}" type="audio/mpeg">
    </audio>

    <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
</body>

</html>
